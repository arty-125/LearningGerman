<header class="header" role="banner">

  <div class="header__start">
    <!-- Mobile hamburger -->
    <button
      class="header__menu-btn"
      type="button"
      (click)="onMenuToggle()"
      aria-label="Toggle navigation menu"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <!-- Logo -->
    <a routerLink="/dashboard" class="header__logo" aria-label="Go to dashboard">
      <span class="header__logo-icon" aria-hidden="true">🇩🇪</span>
      <span class="header__logo-text">
        <strong>Deutsch</strong> Lernen
      </span>
    </a>
  </div>

  <nav class="header__nav" aria-label="Quick navigation">
    <a routerLink="/dashboard" routerLinkActive="is-active" class="header__nav-link">Dashboard</a>
    <a routerLink="/progress" routerLinkActive="is-active" class="header__nav-link">Progress</a>
  </nav>

  <div class="header__end">
    <!-- XP badge -->
    <div class="header__xp" title="Total XP earned">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      <span>{{ progressService.totalXp() }} XP</span>
    </div>

    <!-- Theme toggle -->
    <button
      class="header__theme-btn"
      type="button"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      @if (themeService.isDark()) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    <!-- User avatar placeholder -->
    <button class="header__avatar" type="button" aria-label="User menu" title="User account">
      <span aria-hidden="true">G</span>
    </button>
  </div>

</header>
